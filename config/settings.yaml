# IB-CMC 실험 설정 파일
# 이 파일 값만 바꾸면 창 크기, 폰트, UI 위치/크기/색상을 조정할 수 있습니다.

window:
  # 창 크기는 실행할 때 모니터의 작업 영역(작업표시줄 제외)에 자동으로 맞춰지므로
  # size는 fullscreen: true일 때만 의미가 있다.
  size: [1280, 800]
  # false(기본값): 일반 창모드로 화면에 꽉 차게 띄우되 최소화/복원 버튼은 그대로 둠
  #   (대기화면에서 다른 작업 후 복귀하는 흐름과 맞음).
  # true: 진짜 전체화면(kiosk 모드) — 최소화 버튼이 없어지므로 특수한 경우가 아니면 비추천.
  fullscreen: false
  background_color: "white"

font:
  name: "Malgun Gothic"
  size_situation: 22
  size_chat: 20
  size_interpretation: 24
  # 척도 라벨은 한 줄로 읽혀야 해서(제작요청서) 크기를 줄이고 간격(likert.spacing)을 넓힘
  size_likert_label: 13
  size_likert_number: 18
  size_instruction: 24
  color: "black"

# 채팅 프레임(휴대폰 화면) 위치/크기 - 화면 중앙 기준 좌표(px), y는 위가 양수
chat_frame:
  x: 0
  y: 60
  width: 460
  height: 380

# UI 버전별 말풍선/프레임 스타일
# 제작요청서 지정 색상: 상대방 채팅 = 흰색, 나의 채팅 = 노란색 (카카오톡 스타일)
ui_style:
  iphone:
    frame_bg: [0.96, 0.96, 0.97]
    header_name: "친구"
    avatar_color: [0.75, 0.75, 0.78]
    friend_bubble_color: [1.0, 1.0, 1.0]
    friend_text_color: "black"
    my_bubble_color: [1.0, 0.84, -0.54]
    my_text_color: "black"
    bubble_corner: 18
    bubble_padding: 14
  galaxy:
    frame_bg: [0.96, 0.96, 0.97]
    header_name: "친구"
    avatar_color: [0.05, 0.48, 1.0]
    friend_bubble_color: [1.0, 1.0, 1.0]
    friend_text_color: "black"
    my_bubble_color: [1.0, 0.84, -0.54]
    my_text_color: "black"
    bubble_corner: 8
    bubble_padding: 12

# 1~5점 척도 위치/간격
# spacing은 라벨("상당히 많이 떠오름" 등)이 한 줄로 서로 겹치지 않을 만큼 넓게
likert:
  y: -300
  spacing: 160
  box_size: 34

paths:
  data_dir: "data"

# 구글 스프레드시트 연동 (설정 방법: docs/google_sheets_setup.md)
# enabled: true로 바꾸고 spreadsheet_url을 채우면, 로컬 저장에 더해
# 시트의 responses(응답 원자료) / summary(참가자별 사전·사후 × 온건·부정 집계)
# 워크시트에도 기록된다. 시트 전송이 실패해도 실험은 로컬 저장으로 계속 진행됨.
google_sheets:
  enabled: false
  spreadsheet_url: ""
  credentials_path: "config/google_service_account.json"
